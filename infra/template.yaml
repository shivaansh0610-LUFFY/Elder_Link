AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ElderLink Audio Processing Pipeline - S3 -> EventBridge -> Lambda -> Transcription -> S3

Parameters:
  TranscriptionProviderName:
    Type: String
    Default: mock
    AllowedValues: [mock, voxtral, deepgram, openai, groq]
    Description: Transcription provider for ProcessAudioFunction (mock keeps working with no Deepgram key)
  DeepgramApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Deepgram API key, injected only into ProcessAudioFunction. Required when TranscriptionProviderName=deepgram. Never commit a value.
  OpenAiApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: OpenAI API key, injected only into ProcessAudioFunction. Required when TranscriptionProviderName=openai. Never commit a value.
  GroqApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Groq API key, injected only into ProcessAudioFunction. Required when TranscriptionProviderName=groq. Never commit a value.

  FrontendOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Origin of the deployed frontend (e.g. https://main.xxxx.amplifyapp.com, no trailing slash). Allowed by S3 CORS, the HTTP API and the Lambda CORS headers, in addition to http://localhost:5173 for local dev.
  AlarmEmail:
    Type: String
    Default: ''
    Description: Optional email subscribed to the pipeline alarm topic. Leave empty to create the topic without a subscriber (SNS sends a confirmation email that must be clicked).

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]

Globals:
  Function:
    Timeout: 60
    Runtime: python3.11
    Environment:
      Variables:
        TRANSCRIPTION_PROVIDER: mock
        ELDERLINK_AWS_REGION: us-east-1
        BEDROCK_MODEL_ID: mistral.voxtral-mini-3b-2507
        AUDIO_BUCKET_NAME: !Ref AudioBucket
        MAX_AUDIO_SIZE_BYTES: 10485760

Resources:
  TranscriptionLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: elderlink-transcription-core
      Description: ElderLink transcription core module (TranscriptionProvider, VoxtralProvider, MockTranscriptionProvider)
      ContentUri: ../backend/layers/transcription/
      CompatibleRuntimes:
        - python3.11
      RetentionPolicy: Retain

  AudioBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      # Day 4: lets the browser PUT a recorded voice note directly to a
      # presigned URL under audio/ (see AudioUploadUrlFunction) without
      # proxying the binary through Lambda/API Gateway. Presigning alone
      # authorizes the request; this CORS rule is what lets the BROWSER
      # itself make the cross-origin PUT at all - it does not, by itself,
      # grant any additional access beyond what the presigned URL already
      # allows for that one object.
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - http://localhost:5173
              - !Ref FrontendOrigin
            AllowedMethods:
              - PUT
            AllowedHeaders:
              - Content-Type
            MaxAge: 3000

  ProcessAudioFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: elderlink-process-audio
      CodeUri: ../backend/lambdas/process_audio/
      Handler: handler.lambda_handler
      Role: !GetAtt ProcessAudioRole.Arn
      Layers:
        - !Ref TranscriptionLayer
      Environment:
        Variables:
          TRANSCRIPTION_PROVIDER: !Ref TranscriptionProviderName
          DEEPGRAM_API_KEY: !Ref DeepgramApiKey
          OPENAI_API_KEY: !Ref OpenAiApiKey
          GROQ_API_KEY: !Ref GroqApiKey
          ELDERLINK_AWS_REGION: us-east-1
          BEDROCK_MODEL_ID: mistral.voxtral-mini-3b-2507
          AUDIO_BUCKET_NAME: !Ref AudioBucket
          MAX_AUDIO_SIZE_BYTES: 10485760
      # NOTE: the S3 -> Lambda trigger is wired via the explicit EventBridgeRule
      # + LambdaInvokePermission resources below, not a SAM `Events:` block.
      # (A SAM Events block here would auto-generate a second EventBridge rule
      # + permission with the same pattern, double-invoking this function on
      # every upload - that was a real bug found and fixed during Day 1
      # hardening: two rules existed in the deployed stack simultaneously.)

  ProcessAudioRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ElderLinkS3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub ${AudioBucket.Arn}/audio/*
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub ${AudioBucket.Arn}/transcripts/*
        - PolicyName: ElderLinkBedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: !Sub arn:aws:bedrock:us-east-1::foundation-model/mistral.voxtral-mini-3b-2507

  EventBridgeRule:
    Type: AWS::Events::Rule
    Properties:
      Name: elderlink-s3-audio-created
      Description: Routes S3 Object Created events for audio/ prefix to ProcessAudio Lambda
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - Object Created
        detail:
          bucket:
            name:
              - !Ref AudioBucket
          object:
            key:
              - prefix: audio/
      State: ENABLED
      Targets:
        - Arn: !GetAtt ProcessAudioFunction.Arn
          Id: ProcessAudioFunction

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProcessAudioFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt EventBridgeRule.Arn

  # Phase 6 (Day 2): extraction Lambda layer, bundling backend/core/
  # {care_event,extraction,persistence} (regenerate with
  # infra/build_extraction_layer.sh before packaging/deploying). Kept as a
  # separate layer from TranscriptionLayer since it has a different source
  # tree and update cadence, and ExtractEventsFunction has no need for
  # TranscriptionProvider/VoxtralProvider at all.
  ExtractionLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: elderlink-extraction-core
      Description: ElderLink extraction core modules (care_event schema, ExtractionProvider, CareEventRepository)
      ContentUri: ../backend/layers/extraction/
      CompatibleRuntimes:
        - python3.11
      RetentionPolicy: Retain

  ExtractEventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: elderlink-extract-events
      CodeUri: ../backend/lambdas/extract_events/
      Handler: handler.lambda_handler
      Role: !GetAtt ExtractEventsRole.Arn
      Layers:
        - !Ref ExtractionLayer
      Environment:
        Variables:
          TRANSCRIPT_BUCKET_NAME: !Ref AudioBucket
          CARE_EVENTS_TABLE_NAME: !Ref CareEventsTable
          EXTRACTION_PROVIDER: mock
          ELDERLINK_AWS_REGION: us-east-1
          BEDROCK_EXTRACTION_MODEL_ID: anthropic.claude-3-5-sonnet-20241022-v2:0
          # Phase 7: hackathon-demo care-recipient identity fallback, used
          # only when a transcript carries no explicit care_recipient_id
          # of its own. See backend/lambdas/extract_events/handler.py.
          DEFAULT_CARE_RECIPIENT_ID: demo-dad
      # NOTE: same reasoning as ProcessAudioFunction above - the trigger is
      # wired via the explicit TranscriptCreatedEventBridgeRule +
      # ExtractEventsInvokePermission resources below, not a SAM `Events:`
      # block, to avoid a second auto-generated rule double-invoking this
      # function per transcript write.

  ExtractEventsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ElderLinkExtractionS3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub ${AudioBucket.Arn}/transcripts/*
        - PolicyName: ElderLinkExtractionDynamoDbAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # UpdateItem only - CareEventRepository.put_event is the only
              # DynamoDB operation this function performs. Indexes
              # (CareTimelineIndex, TranscriptIndex) are maintained
              # automatically by DynamoDB on the base-table write and need
              # no separate write permission; this function never queries.
              - Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                Resource: !GetAtt CareEventsTable.Arn
        - PolicyName: ElderLinkExtractionBedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Scoped identically to ProcessAudioRole's Bedrock access -
              # granted so the code path isn't blocked purely by IAM once
              # Bedrock access is verified, but EXTRACTION_PROVIDER=mock
              # remains the only path actually exercised (see
              # backend/core/extraction/bedrock.py).
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: !Sub arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-3-5-sonnet-20241022-v2:0

  # Filtered to the transcripts/ prefix only (never audio/, never anything
  # this function itself could produce, since it writes only to DynamoDB) -
  # the same duplicate-trigger hazard noted on EventBridgeRule above is why
  # this stays narrow rather than a generic "any Object Created" rule.
  TranscriptCreatedEventBridgeRule:
    Type: AWS::Events::Rule
    Properties:
      Name: elderlink-s3-transcript-created
      Description: Routes S3 Object Created events for transcripts/ prefix to ExtractEvents Lambda
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - Object Created
        detail:
          bucket:
            name:
              - !Ref AudioBucket
          object:
            key:
              - prefix: transcripts/
      State: ENABLED
      Targets:
        - Arn: !GetAtt ExtractEventsFunction.Arn
          Id: ExtractEventsFunction

  ExtractEventsInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ExtractEventsFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt TranscriptCreatedEventBridgeRule.Arn

  # Phase 5 (Day 2): persists only VALIDATED CareEvents produced by
  # backend/core/persistence.CareEventRepository. As of Phase 6,
  # ExtractEventsFunction above is the writer.  See
  # backend/core/persistence/keys.py for the full key-design rationale;
  # this resource is a direct implementation of it.
  CareEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: elderlink-care-events
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        # Only key attributes are declared here - DynamoDB is schemaless
        # for every other item attribute (event_type, subject, summary,
        # claim_stance, occurred_at, evidence, ...).
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
        - AttributeName: transcript_id
          AttributeType: S
        - AttributeName: event_id
          AttributeType: S
      KeySchema:
        # pk = PATIENT#<care_recipient_id>, sk = EVENT#<event_id> (the
        # Phase 4.1 deterministic identity) - this is what makes a repeated
        # write of the same logical event an idempotent upsert rather than
        # a new row.
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      LocalSecondaryIndexes:
        # Access pattern A: care events for one recipient, newest first.
        # Same partition key as the base table, sorted by created_at
        # instead of event_id - an LSI, not a GSI, since only the sort
        # order needs to differ.
        - IndexName: CareTimelineIndex
          KeySchema:
            - AttributeName: pk
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      GlobalSecondaryIndexes:
        # Access pattern B: events generated from one transcript. Requires
        # a full GSI (not an LSI) because its partition key (transcript_id)
        # differs from the base table's (care_recipient_id) - the one GSI
        # this phase adds, justified by that specific, explicitly required
        # access pattern.
        - IndexName: TranscriptIndex
          KeySchema:
            - AttributeName: transcript_id
              KeyType: HASH
            - AttributeName: event_id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # Phase 7 (Day 3): the smallest read-only API the frozen frontend needs -
  # one Lambda backing one route, fronted by an HTTP API (not a REST API -
  # no request/response mapping templates or usage plans are needed for a
  # single unauthenticated read route, and HTTP APIs are cheaper/simpler).
  # DEMO-ONLY: no authorizer is attached - see GetTimelineFunction's
  # handler docstring for why that's acceptable here and not in production.
  GetTimelineFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: elderlink-get-timeline
      CodeUri: ../backend/lambdas/get_timeline/
      Handler: handler.lambda_handler
      Role: !GetAtt GetTimelineRole.Arn
      Layers:
        - !Ref ExtractionLayer
      Environment:
        Variables:
          CARE_EVENTS_TABLE_NAME: !Ref CareEventsTable
          ELDERLINK_AWS_REGION: us-east-1
          # Demo-only CORS: the Vite dev server origin by default. Override
          # per deployment (e.g. a deployed frontend's real origin) rather
          # than widening this to "*" once real user data is involved.
          ELDERLINK_CORS_ORIGIN: !Ref FrontendOrigin
      Events:
        GetTimeline:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareEventsHttpApi
            Path: /care-recipients/{care_recipient_id}/timeline
            Method: GET

  GetTimelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ElderLinkGetTimelineDynamoDbReadAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Read-only, least-privilege: Query only (CareEventRepository.
              # get_timeline), against the base table and its
              # CareTimelineIndex LSI - never PutItem/UpdateItem/DeleteItem,
              # and this function never scans.
              - Effect: Allow
                Action:
                  - dynamodb:Query
                Resource:
                  - !GetAtt CareEventsTable.Arn
                  - !Sub ${CareEventsTable.Arn}/index/CareTimelineIndex

  # Day 5: the one supported write path for an already-persisted CareEvent -
  # fixes the "verification status is only ever client-side React state"
  # gap the frontend forensic audit found. Deliberately narrow: the request
  # can only set `status` to "verified" or "uncertain" (see
  # update_care_event_status/handler.py); every other canonical CareEvent
  # field is immutable via this route, enforced at the persistence layer by
  # CareEventRepository.update_review_state, not merely by this handler
  # choosing not to expose the other fields.
  UpdateCareEventStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: elderlink-update-care-event-status
      CodeUri: ../backend/lambdas/update_care_event_status/
      Handler: handler.lambda_handler
      Role: !GetAtt UpdateCareEventStatusRole.Arn
      Layers:
        - !Ref ExtractionLayer
      Environment:
        Variables:
          CARE_EVENTS_TABLE_NAME: !Ref CareEventsTable
          ELDERLINK_AWS_REGION: us-east-1
          ELDERLINK_CORS_ORIGIN: !Ref FrontendOrigin
      Events:
        UpdateCareEventStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareEventsHttpApi
            Path: /care-recipients/{care_recipient_id}/care-events/{event_id}
            Method: PATCH

  UpdateCareEventStatusRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ElderLinkUpdateCareEventStatusDynamoDbAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # UpdateItem only, scoped to the base table by primary key -
              # never PutItem (which could create a new item outside
              # put_event's extraction-provenance path) and never
              # Query/Scan/DeleteItem/GSI or LSI access. This function
              # can only flip review_state/verification_reason on an
              # event that already exists.
              - Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                Resource: !GetAtt CareEventsTable.Arn

  # Day 4: the ingestion bridge - signs a presigned S3 PutObject URL under
  # audio/ so the browser's VoiceRecorder can upload a real recording
  # directly to S3. This Lambda never touches audio bytes, transcription,
  # or extraction - once the object lands in S3, the existing, unchanged
  # EventBridge -> process_audio -> ... -> DynamoDB pipeline takes over.
  # See backend/lambdas/audio_upload_url/handler.py for the full security
  # posture (no AWS credentials ever reach the browser; object keys are
  # always server-generated under audio/, never client-supplied).
  AudioUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: elderlink-audio-upload-url
      CodeUri: ../backend/lambdas/audio_upload_url/
      Handler: handler.lambda_handler
      Role: !GetAtt AudioUploadUrlRole.Arn
      # No layers - this function only calls boto3's S3 presigning, which
      # needs none of the care_event/extraction/persistence/transcription
      # modules the other Lambdas' layers provide.
      Environment:
        Variables:
          AUDIO_BUCKET_NAME: !Ref AudioBucket
          ELDERLINK_AWS_REGION: us-east-1
          DEFAULT_CARE_RECIPIENT_ID: demo-dad
          ELDERLINK_CORS_ORIGIN: !Ref FrontendOrigin
      Events:
        AudioUploadUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareEventsHttpApi
            Path: /audio/upload-url
            Method: POST

  AudioUploadUrlRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ElderLinkAudioUploadUrlS3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # PutObject only, scoped to audio/* only - this role can sign
              # a URL that lets a browser write ONE object under audio/; it
              # cannot read, list, or delete anything in the bucket. No
              # s3:* wildcards.
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub ${AudioBucket.Arn}/audio/*

  # Flag notifications: when a caregiver flags an event for review, the rest of
  # that patient's Care Circle is emailed via SNS. One shared topic; each
  # address is subscribed with a FilterPolicy on a `recipient` message
  # attribute, so a publish reaches only its intended person. See
  # backend/lambdas/notify_flag/handler.py.
  FlagNotificationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: elderlink-flag-notifications
      DisplayName: ElderLink

  NotifyFlagFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: elderlink-notify-flag
      CodeUri: ../backend/lambdas/notify_flag/
      Handler: handler.lambda_handler
      Role: !GetAtt NotifyFlagRole.Arn
      Environment:
        Variables:
          FLAG_NOTIFICATIONS_TOPIC_ARN: !Ref FlagNotificationsTopic
          ELDERLINK_AWS_REGION: us-east-1
          ELDERLINK_CORS_ORIGIN: !Ref FrontendOrigin
      Events:
        NotifyFlag:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareEventsHttpApi
            Path: /notifications/flag
            Method: POST

  NotifyFlagRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ElderLinkNotifyFlagSnsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Only this one topic; no wildcards.
              - Effect: Allow
                Action:
                  - sns:Publish
                  - sns:Subscribe
                  - sns:ListSubscriptionsByTopic
                Resource: !Ref FlagNotificationsTopic

  # Cheap observability: any error from the two pipeline Lambdas (S3 audio ->
  # transcript -> care events) raises an alarm that publishes to a dedicated
  # topic. Separate from FlagNotificationsTopic because that topic's
  # per-recipient filter policies would drop these messages.
  PipelineAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: elderlink-pipeline-alarms
      DisplayName: ElderLink pipeline alarms

  PipelineAlarmSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref PipelineAlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  ProcessAudioErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: elderlink-process-audio-errors
      AlarmDescription: ProcessAudio (transcription) Lambda reported at least one error
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ProcessAudioFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref PipelineAlarmTopic

  ExtractEventsErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: elderlink-extract-events-errors
      AlarmDescription: ExtractEvents Lambda reported at least one error
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ExtractEventsFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref PipelineAlarmTopic

  # CORS is also configured at the HTTP API level (in addition to the
  # headers GetTimelineFunction/AudioUploadUrlFunction themselves return)
  # so OPTIONS preflight requests are answered by API Gateway directly,
  # without invoking either Lambda at all.
  CareEventsHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: elderlink-care-events-api
      CorsConfiguration:
        AllowOrigins:
          - http://localhost:5173
          - !Ref FrontendOrigin
        AllowMethods:
          - GET
          - POST
          - PATCH
          - OPTIONS
        AllowHeaders:
          - Content-Type

Outputs:
  PipelineAlarmTopicArn:
    Description: SNS topic that receives pipeline Lambda error alarms
    Value: !Ref PipelineAlarmTopic

  AudioBucketName:
    Description: Name of the S3 bucket for audio uploads and transcripts
    Value: !Ref AudioBucket
    Export:
      Name: ElderLink-AudioBucketName

  LambdaFunctionName:
    Description: Name of the ProcessAudio Lambda function
    Value: !Ref ProcessAudioFunction
    Export:
      Name: ElderLink-ProcessAudioFunctionName

  EventBridgeRuleName:
    Description: Name of the EventBridge rule
    Value: !Ref EventBridgeRule
    Export:
      Name: ElderLink-EventBridgeRuleName

  TranscriptionLayerArn:
    Description: ARN of the transcription core Lambda layer
    Value: !Ref TranscriptionLayer
    Export:
      Name: ElderLink-TranscriptionLayerArn

  CareEventsTableName:
    Description: Name of the DynamoDB table storing validated CareEvents
    Value: !Ref CareEventsTable
    Export:
      Name: ElderLink-CareEventsTableName

  ExtractEventsFunctionName:
    Description: Name of the ExtractEvents Lambda function
    Value: !Ref ExtractEventsFunction
    Export:
      Name: ElderLink-ExtractEventsFunctionName

  TranscriptCreatedEventBridgeRuleName:
    Description: Name of the EventBridge rule routing transcript creation to ExtractEvents
    Value: !Ref TranscriptCreatedEventBridgeRule
    Export:
      Name: ElderLink-TranscriptCreatedEventBridgeRuleName

  GetTimelineFunctionName:
    Description: Name of the GetTimeline read-API Lambda function
    Value: !Ref GetTimelineFunction
    Export:
      Name: ElderLink-GetTimelineFunctionName

  CareEventsApiUrl:
    Description: Base URL of the CareEvents read API (demo-only, unauthenticated) - set as VITE_ELDERLINK_API_URL for the frontend
    Value: !Sub https://${CareEventsHttpApi}.execute-api.${AWS::Region}.amazonaws.com
    Export:
      Name: ElderLink-CareEventsApiUrl

  AudioUploadUrlFunctionName:
    Description: Name of the Day 4 presigned-upload-URL Lambda function
    Value: !Ref AudioUploadUrlFunction
    Export:
      Name: ElderLink-AudioUploadUrlFunctionName

  FlagNotificationsTopicArn:
    Description: SNS topic used to email a Care Circle when an update is flagged for review
    Value: !Ref FlagNotificationsTopic
    Export:
      Name: ElderLink-FlagNotificationsTopicArn

  UpdateCareEventStatusFunctionName:
    Description: Name of the Day 5 verification-status write Lambda function
    Value: !Ref UpdateCareEventStatusFunction
    Export:
      Name: ElderLink-UpdateCareEventStatusFunctionName
